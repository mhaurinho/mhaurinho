name: Atualizar perfil

on:
  schedule:
    - cron: '0 9 * * *' # todo dia, 06:00 em Brasília
  push:
    branches: [circleci-project-setup]
    paths: ['scripts/**', '.github/workflows/profile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar SVGs
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: atualizar SVGs do perfil" && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00b37a&color_dots=#ebedf0,#9be9c8,#40c996,#00b37a,#006b49
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff9c&color_dots=#0b2a21,#0e6b4d,#00b37a,#00e08f,#19c6ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
